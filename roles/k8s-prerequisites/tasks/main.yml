---
# Kubernetes Prerequisites Role
# Install CRI-O, kubeadm, kubelet, and configure system for Kubernetes

- name: Wait for SSH to be ready
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 300

- name: Update system packages
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - ca-certificates
      - lsb-release
      - iptables
    state: present
  become: yes

- name: Configure kernel modules for Kubernetes
  ansible.builtin.blockinfile:
    path: /etc/modules-load.d/k8s.conf
    create: yes
    block: |
      overlay
      br_netfilter
  become: yes

- name: Load kernel modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: yes

- name: Configure sysctl for Kubernetes
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }
  become: yes

- name: Disable swap
  ansible.builtin.shell: swapoff -a
  when: ansible_swaptotal_mb > 0
  become: yes

- name: Comment out swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
  become: yes

- name: Add Kubernetes and C-RIO Repository
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    . /etc/environment
    set +a
    
    # Kubernetes
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key |
        gpg --dearmor --batch --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /" |
        tee /etc/apt/sources.list.d/kubernetes.list
    
    # C-RIO
    curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/Release.key |
        gpg --dearmor --batch --yes -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

    echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/deb/ /" |
        tee /etc/apt/sources.list.d/cri-o.list
  args:
    executable: /bin/bash
  become: yes
  changed_when: false

- name: Install Kubernetes and CRI-O packages
  ansible.builtin.apt:
    name:
      - cri-o
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
  become: yes

- name: Remove existing CRI-O cgroup setting
  ansible.builtin.replace:
    path: /etc/crio/crio.conf.d/10-crio.conf
    regexp: (?m)^cgroup_manager\s*=.*\n?
    replace: ""
  become: yes

- name: Configure CRI-O to use the systemd cgroup manager
  ansible.builtin.replace:
    path: /etc/crio/crio.conf.d/10-crio.conf
    regexp: (?m)^(\[crio\.runtime\])\s*$
    replace: |
      \1
      cgroup_manager = "systemd"
  become: yes

- name: Configure CRI-O proxy environment
  ansible.builtin.shell: |
    set -euo pipefail
    tmp=$(mktemp)
    merged=$(mktemp)
    trap 'rm -f "$tmp" "$merged"' EXIT
    touch /etc/default/crio
    cat /etc/default/crio > "$tmp"
    cat /etc/environment >> "$tmp"
    tac "$tmp" | awk -F= '!seen[$1]++' | tac > "$merged"
    sed -i 's|,{{ k8s_pod_cidr }}||g' "$merged"
    sed -i '\|^no_proxy=| s|$|,{{ k8s_no_proxy_entries }}|' "$merged"
    sed -i '\|^NO_PROXY=| s|$|,{{ k8s_no_proxy_entries }}|' "$merged"
    if ! cmp -s "$merged" /etc/default/crio; then
      cp "$merged" /etc/default/crio
      echo changed
    fi
  become: yes
  register: crio_proxy_config
  changed_when: "'changed' in crio_proxy_config.stdout"

- name: Enable and start CRI-O service
  ansible.builtin.systemd:
    name: crio
    state: restarted
    enabled: yes
    daemon_reload: yes
  become: yes

- name: Install Kubernetes tools
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
  become: yes

- name: Hold Kubernetes tools versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: yes

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes
    daemon_reload: yes
  become: yes
  # Don't start kubelet yet - it will fail without kubeadm init/join configuration

- name: Wait for CRI-O socket
  ansible.builtin.wait_for:
    path: /var/run/crio/crio.sock
    state: present
    timeout: 60
  become: yes
