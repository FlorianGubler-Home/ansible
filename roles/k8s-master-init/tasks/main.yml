---
# Kubernetes Master Initialization Role
# Initialize master node with kubeadm and install CNI

- name: Check if Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: k8s_initialized

- name: Initialize Kubernetes master cluster
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    . /etc/environment
    set +a
    kubeadm init \
      --cri-socket unix:///var/run/crio/crio.sock \
      --pod-network-cidr="{{ k8s_pod_cidr }}" \
      --kubernetes-version="v{{ k8s_version }}" \
      --ignore-preflight-errors=NumCPU,MemSize \
      --skip-token-print
  become: yes
  when: not k8s_initialized.stat.exists
  register: kubeadm_init
  changed_when: kubeadm_init.rc == 0

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'
  become: yes

- name: Copy kubeconfig to root
  ansible.builtin.shell: |
    cp /etc/kubernetes/admin.conf /root/.kube/config
    chmod 600 /root/.kube/config
  become: yes
  changed_when: false

- name: Create .kube directory for debian user
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    mode: '0700'
    owner: debian
    group: debian
  become: yes

- name: Copy kubeconfig for debian user
  ansible.builtin.shell: |
    cp /etc/kubernetes/admin.conf /home/debian/.kube/config
    chown debian:debian /home/debian/.kube/config
    chmod 600 /home/debian/.kube/config
  become: yes
  changed_when: false

- name: Wait for Kubernetes API server to be ready
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      if kubectl --kubeconfig=/root/.kube/config get nodes >/dev/null 2>&1; then
        echo "API server is ready"
        exit 0
      fi
      echo "Waiting for API server... ($i/60)"
      sleep 2
    done
    echo "API server failed to start"
    exit 1
  become: yes
  changed_when: false
  register: api_ready
  until: api_ready.rc == 0
  retries: 1

- name: Deploy Calico CNI - Create calico namespace
  ansible.builtin.shell: |
    kubectl --kubeconfig=/root/.kube/config create namespace calico-system --dry-run=client -o yaml |
      kubectl --kubeconfig=/root/.kube/config apply -f -
  become: yes
  changed_when: false

- name: Deploy Calico CNI - Apply Tigera operator
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    . /etc/environment
    set +a
    kubectl --kubeconfig=/root/.kube/config apply --server-side --force-conflicts \
      -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  become: yes
  register: calico_deploy
  until: calico_deploy.rc == 0
  retries: 3
  delay: 5
  changed_when: "'created' in calico_deploy.stderr or 'configured' in calico_deploy.stderr"

- name: Wait for Tigera operator to be ready
  ansible.builtin.shell: |
    kubectl --kubeconfig=/root/.kube/config -n tigera-operator wait \
      --for=condition=Available deployment/tigera-operator \
      --timeout=300s
  become: yes
  changed_when: false
  register: tigera_operator_ready
  until: tigera_operator_ready.rc == 0
  retries: 3
  delay: 10

- name: Create Calico configuration CR
  ansible.builtin.shell: |
    cat <<EOF | kubectl --kubeconfig=/root/.kube/config apply -f -
    apiVersion: operator.tigera.io/v1
    kind: Installation
    metadata:
      name: default
    spec:
      calicoNetwork:
        ipPools:
          - blockSize: 26
            cidr: "{{ k8s_pod_cidr }}"
            encapsulation: VXLAN
            natOutgoing: Enabled
            nodeSelector: all()
    EOF
  become: yes

- name: Wait for Calico deployments
  ansible.builtin.shell: |
    kubectl --kubeconfig=/root/.kube/config -n calico-system wait \
      --for=condition=Available deployment/calico-kube-controllers \
      --timeout=300s
    kubectl --kubeconfig=/root/.kube/config -n calico-system rollout status \
      deployment/calico-typha --timeout=300s
  become: yes
  changed_when: false
  register: calico_controllers_ready
  until: calico_controllers_ready.rc == 0
  retries: 3
  delay: 10

- name: Wait for Calico node and CSI daemonsets
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig=/root/.kube/config -n calico-system rollout status \
      daemonset/calico-node --timeout=300s
    kubectl --kubeconfig=/root/.kube/config -n calico-system rollout status \
      daemonset/csi-node-driver --timeout=300s
  become: yes
  changed_when: false
  register: calico_daemonsets_ready
  until: calico_daemonsets_ready.rc == 0
  retries: 3
  delay: 10

- name: Verify Calico CNI configuration exists
  ansible.builtin.shell: |
    test -n "$(find /etc/cni/net.d -maxdepth 1 -type f -name '*.conflist' -print -quit)"
  become: yes
  changed_when: false
  register: calico_cni_ready
  until: calico_cni_ready.rc == 0
  retries: 30
  delay: 10

- name: Generate kubeadm join token
  ansible.builtin.shell: |
    kubeadm token create --ttl 24h
  become: yes
  register: join_token
  changed_when: false

- name: Get certificate key for join
  ansible.builtin.shell: |
    kubeadm init phase upload-certs --upload-certs 2>&1 | tail -1
  become: yes
  register: cert_key
  changed_when: false

- name: Set API server endpoint
  ansible.builtin.set_fact:
    k8s_api_endpoint: "{{ ansible_host }}:6443"

- name: Get CA cert hash
  ansible.builtin.shell: |
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
  become: yes
  register: ca_cert_hash
  changed_when: false

- name: Set join token facts for workers
  ansible.builtin.set_fact:
    k8s_join_token: "{{ join_token.stdout }}"
    k8s_ca_cert_hash: "{{ ca_cert_hash.stdout }}"

- name: Display cluster initialization status
  ansible.builtin.debug:
    msg: |
      Kubernetes master initialized successfully
      API Endpoint: {{ k8s_api_endpoint }}
      Join Token: {{ k8s_join_token | default('(already initialized)') }}
