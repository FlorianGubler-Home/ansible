---
# GitHub Actions Runner Setup Role
# Register and configure self-hosted GitHub Actions runners

- name: Create github-runner user
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    home: "{{ github_runner_home }}"
    shell: /bin/bash
    state: present
  become: yes

- name: Ensure github-runner home directory exists
  ansible.builtin.file:
    path: "{{ github_runner_home }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: '0755'
  become: yes

- name: Set GitHub runner service name
  ansible.builtin.set_fact:
    github_runner_service_name: "actions.runner.{{ github_org }}.{{ inventory_hostname }}"

- name: Check for an existing GitHub runner installation
  ansible.builtin.stat:
    path: "{{ github_runner_home }}/{{ item }}"
  loop:
    - .runner
    - svc.sh
    - config.sh
  register: github_runner_install_files

- name: Collect systemd service facts
  ansible.builtin.service_facts:

- name: Determine whether a GitHub runner is already installed
  ansible.builtin.set_fact:
    github_runner_installed: >-
      {{
        (github_runner_install_files.results
          | selectattr('stat.exists', 'equalto', true)
          | list
          | length > 0)
        or
        ((github_runner_service_name + '.service') in ansible_facts.services)
      }}

- name: Remove existing GitHub Actions runner
  when: github_runner_installed | bool
  block:
    - name: Create runner removal token from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/orgs/{{ github_org }}/actions/runners/remove-token"
        method: POST
        headers:
          Authorization: "token {{ vault_github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 201
      register: github_remove_token_response
      no_log: true
      retries: 3
      delay: 5
      until: github_remove_token_response.status == 201

    - name: Set runner removal token fact
      ansible.builtin.set_fact:
        github_removal_token: "{{ github_remove_token_response.json.token }}"
      no_log: true

    - name: Stop and disable existing runner service
      ansible.builtin.systemd:
        name: "{{ github_runner_service_name }}"
        enabled: no
        state: stopped
        daemon_reload: yes
      become: yes
      when: (github_runner_service_name + '.service') in ansible_facts.services

    - name: Uninstall existing runner systemd service
      ansible.builtin.shell: |
        cd {{ github_runner_home }}
        ./svc.sh uninstall
      become: yes
      when: (github_runner_install_files.results | selectattr('item', 'equalto', 'svc.sh') | first).stat.exists

    - name: Unregister existing runner from GitHub
      ansible.builtin.shell: |
        set -a
        . /etc/environment
        set +a
        cd {{ github_runner_home }}
        ./config.sh remove --token "{{ github_removal_token }}"
      args:
        chdir: "{{ github_runner_home }}"
      become: yes
      become_user: "{{ github_runner_user }}"
      no_log: true
      when: (github_runner_install_files.results | selectattr('item', 'equalto', 'config.sh') | first).stat.exists

    - name: Remove existing runner installation directory
      ansible.builtin.file:
        path: "{{ github_runner_home }}"
        state: absent
      become: yes

- name: Recreate github-runner home directory
  ansible.builtin.file:
    path: "{{ github_runner_home }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: '0755'
  become: yes

- name: Create runner registration token from GitHub API
  ansible.builtin.uri:
    url: "https://api.github.com/orgs/{{ github_org }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "token {{ vault_github_pat }}"
      Accept: "application/vnd.github.v3+json"
    status_code: 201
  register: github_token_response
  no_log: true
  retries: 3
  delay: 5
  until: github_token_response.status == 201

- name: Set registration token fact
  ansible.builtin.set_fact:
    github_registration_token: "{{ github_token_response.json.token }}"
  no_log: true

- name: Download GitHub Actions runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz"
    dest: "/tmp/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz"
    mode: '0644'
  register: runner_download
  retries: 3
  delay: 5
  until: runner_download is succeeded

- name: Extract runner archive
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_home }}"
    remote_src: yes
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
  become: yes

- name: Clean up runner tarball
  ansible.builtin.file:
    path: "/tmp/actions-runner-linux-{{ github_runner_architecture }}-{{ github_runner_version }}.tar.gz"
    state: absent

- name: Install runner dependencies
  ansible.builtin.shell: |
    bash {{ github_runner_home }}/bin/installdependencies.sh
  become: yes
  register: deps_install
  ignore_errors: yes

- name: Register GitHub Actions runner
  ansible.builtin.shell: |
    set -a
    . /etc/environment
    set +a
    cd {{ github_runner_home }}
    ./config.sh \
      --url https://github.com/{{ github_org }} \
      --token {{ github_registration_token }} \
      --name {{ inventory_hostname }} \
      --runnergroup "{{ github_runner_group }}" \
      --labels "{{ github_runner_labels | join(',') }}" \
      --unattended \
      --replace
  become: yes
  become_user: "{{ github_runner_user }}"

- name: Install runner as systemd service
  ansible.builtin.shell: |
    cd {{ github_runner_home }}
    ./svc.sh install {{ github_runner_user }}
  become: yes

- name: Enable and start runner service
  ansible.builtin.systemd:
    name: actions.runner.{{ github_org }}.{{ inventory_hostname }}
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  register: service_start

- name: Wait for runner to be online
  ansible.builtin.pause:
    seconds: 5

- name: Verify runner service is active
  ansible.builtin.systemd:
    name: actions.runner.{{ github_org }}.{{ inventory_hostname }}
  become: yes
  register: runner_service
  failed_when: runner_service.status.ActiveState != 'active'

- name: Display runner setup status
  ansible.builtin.debug:
    msg: |
      GitHub Actions runner installed successfully
      Runner Name: {{ inventory_hostname }}
      Organization: {{ github_org }}
      Group: {{ github_runner_group }}
      Service: actions.runner.{{ github_org }}.{{ inventory_hostname }}